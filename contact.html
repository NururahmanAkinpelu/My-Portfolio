<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css" rel="stylesheet">
        <title>Contact | Nuru-Rahman</title>
    </head>
    <body>
        <header class="l-header"><nav class="nav bd-grid">
            <a href="index.html" class="nav__logo">Nuru-Rahman</a>
            <div class="nav__menu" id="nav-menu"><ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li><li class="nav__item"><a href="about.html" class="nav__link">About</a></li><li class="nav__item"><a href="projects.html" class="nav__link">Projects</a></li><li class="nav__item"><a href="academic_planner.html" class="nav__link">Academic Planner</a></li><li class="nav__item"><a href="contact.html" class="nav__link active">Contact</a></li>
            </ul></div><div class="nav__toggle" id="nav-toggle" aria-label="Open navigation menu"><i class="bx bx-menu"></i></div>
        </nav></header>
        <main class="l-main"><section class="contact section page-section" id="contact">
            <h1 class="section-title">Contact</h1>
            <div class="contact__container bd-grid"><form class="contact__form" id="contact-form" novalidate>
                <label for="contact-name">Name</label>
                <input type="text" placeholder="Name" class="contact__input" id="contact-name" name="name" aria-label="Name" required>
                <label for="contact-email">Email</label>
                <input type="email" placeholder="Email" class="contact__input" id="contact-email" name="email" aria-label="Email" required>
                <label for="contact-phone">Phone number</label>
                <input type="tel" placeholder="Phone number" class="contact__input" id="contact-phone" name="phone" inputmode="numeric" aria-label="Phone number" required>
                <label for="contact-message">Message</label>
                <textarea placeholder="Message" name="message" id="contact-message" rows="10" class="contact__input" aria-label="Message" required></textarea>
                <p class="contact__feedback" id="contact-feedback" role="alert" aria-live="polite"></p>
                <input type="submit" value="Submit" class="contact__button button">
            </form></div>
        </section></main>
        <footer class="footer"><p class="footer__title">Nuru-Rahman</p><p class="footer__copy">&#169; Nuru-Rahman Akinpelu. All rights reserved</p></footer>
        <script src="https://unpkg.com/scrollreveal"></script>
        <script src="assets/js/main.js"></script>
        <script src="assets/js/contact.js"></script>
    </body>
</html>
